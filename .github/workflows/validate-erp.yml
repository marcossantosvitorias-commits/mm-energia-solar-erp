name: Validate ERP

on:
  push:
    branches:
      - supabase-source-of-truth
  pull_request:
    paths:
      - 'MM_ERP_GitHub_Pronto/apps/web/**'
      - 'MM_ERP_GitHub_Pronto/supabase/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MM_ERP_GitHub_Pronto/apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MM_ERP_GitHub_Pronto/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
