name: Patch WEB-006717414

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajuste ERP
        run: python scripts/patch_web_006717414.py
      - name: Commitar ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MM_ERP_GitHub_Pronto/apps/web/src/pages/CotacoesBelenusPage.jsx MM_ERP_GitHub_Pronto/apps/web/src/pages/ProposalGenerator.jsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Adiciona kit Auxsol 20 kW e imagens na proposta"
          git push
