name: Aplicar Auxsol 64 na Preview

on:
  push:
    branches:
      - erp-v2-preview
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: erp-v2-preview
          fetch-depth: 1
      - name: Aplicar patch
        run: python scripts/patch_auxsol_64_preview.py
      - name: Commitar se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MM_ERP_GitHub_Pronto/apps/web/src/pages/CotacoesBelenusSupabasePage.jsx MM_ERP_GitHub_Pronto/apps/web/src/pages/InversorStringPage.jsx MM_ERP_GitHub_Pronto/apps/web/src/pages/ProposalGenerator.jsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Move kit Auxsol 20 kW com 64 placas para inversor string"
          git push
