name: Verificar ERP

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint e build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MM_ERP_GitHub_Pronto/apps/web

    steps:
      - name: Baixar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Executar lint
        run: npm run lint

      - name: Executar build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Salvar build para inspeção
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mm-erp-build
          path: MM_ERP_GitHub_Pronto/apps/web/dist
          if-no-files-found: error
          retention-days: 7
