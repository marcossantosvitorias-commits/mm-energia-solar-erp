name: Aplicar migrations do Supabase

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Digite APLICAR para confirmar a execução no banco configurado'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirm_production == 'APLICAR' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    defaults:
      run:
        working-directory: MM_ERP_GitHub_Pronto

    steps:
      - name: Baixar código da ERP 2.0 Preview
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: erp-v2-preview

      - name: Instalar ferramentas fixadas
        run: |
          npm install --global supabase@2.101.0
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Validar segredos
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo 'Falta o secret SUPABASE_ACCESS_TOKEN' && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo 'Falta o secret SUPABASE_PROJECT_REF' && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo 'Falta o secret SUPABASE_DB_PASSWORD' && exit 1)

      - name: Vincular projeto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Conferir migrations locais
        run: |
          test -f supabase/migrations/20260728080000_service_orders.sql
          test -f supabase/migrations/20260728090000_service_order_storage.sql
          test -f supabase/migrations/20260728100000_sale_to_service_order.sql

      - name: Aplicar somente migrations ainda não registradas
        run: |
          set -euo pipefail
          DB_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}@aws-0-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require"

          for file in $(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            base="$(basename "$file" .sql)"
            version="${base%%_*}"

            if [ "$version" = "20260727000100" ]; then
              echo "Ignorando migration inicial já existente: $base"
              continue
            fi

            applied="$(psql "$DB_URL" -tAc "select 1 from supabase_migrations.schema_migrations where version = '$version' limit 1")"
            if [ "$applied" = "1" ]; then
              echo "Já aplicada: $base"
              continue
            fi

            echo "Aplicando: $base"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$file"
            supabase migration repair "$version" --status applied --password "$SUPABASE_DB_PASSWORD"
          done

      - name: Validar banco após aplicação
        run: |
          DB_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}@aws-0-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require"
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if to_regclass('public.service_orders') is null then
              raise exception 'Tabela public.service_orders não encontrada';
            end if;
            if to_regclass('public.service_order_items') is null then
              raise exception 'Tabela public.service_order_items não encontrada';
            end if;
            if to_regclass('public.service_order_checklist') is null then
              raise exception 'Tabela public.service_order_checklist não encontrada';
            end if;
            if to_regclass('public.service_order_photos') is null then
              raise exception 'Tabela public.service_order_photos não encontrada';
            end if;
            if to_regclass('public.service_order_signatures') is null then
              raise exception 'Tabela public.service_order_signatures não encontrada';
            end if;
          end $$;

          select id, name, public, file_size_limit
          from storage.buckets
          where id = 'service-orders';
          SQL