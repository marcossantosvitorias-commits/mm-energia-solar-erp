name: Publicar ERP 2.0 Preview

on:
  push:
    branches:
      - erp-v2-preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: erp-v2-preview-pages
  cancel-in-progress: true

jobs:
  build:
    name: Gerar Preview
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MM_ERP_GitHub_Pronto/apps/web

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependências
        run: npm install

      - name: Gerar build para GitHub Pages
        run: npm run build -- --base=/mm-energia-solar-erp/
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Preparar fallback das rotas da SPA
        run: cp dist/index.html dist/404.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato da Preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: MM_ERP_GitHub_Pronto/apps/web/dist

  deploy:
    name: Publicar Preview
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Workflow registrado na branch principal e executado somente para a Preview.
