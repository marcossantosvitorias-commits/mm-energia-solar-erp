    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="%BASE_URL%belcred-options.js?v=20260807-1"></script>
    <script>
      (() => {
        const liberarCamposMaira = () => {
          document.querySelectorAll('.pf-linha-maira input').forEach((input) => {
            input.readOnly = false;
            input.disabled = false;
            input.removeAttribute('readonly');
            input.removeAttribute('disabled');
          });
        };

        document.addEventListener('pointerdown', (event) => {
          const input = event.target.closest('.pf-linha-maira input');
          if (!input) return;
          input.readOnly = false;
          input.disabled = false;
          setTimeout(() => input.focus({ preventScroll: true }), 0);
        }, true);

        document.addEventListener('input', (event) => {
          const nome = event.target.closest('.pf-maira-nome .pf-nome');
          if (!nome) return;
          const linhas = Array.from(document.querySelectorAll('.pf-linha'));
          const artigo = nome.closest('.pf-linha');
          const indice = linhas.indexOf(artigo);
          const posicao = nome.selectionStart;
          setTimeout(() => {
            const novo = document.querySelectorAll('.pf-linha')[indice]?.querySelector('.pf-nome');
            if (!novo) return;
            novo.focus({ preventScroll: true });
            if (typeof posicao === 'number' && novo.setSelectionRange) novo.setSelectionRange(posicao, posicao);
          }, 0);
        }, true);

        new MutationObserver(liberarCamposMaira).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['readonly', 'disabled'] });
        window.addEventListener('DOMContentLoaded', liberarCamposMaira);
        setTimeout(liberarCamposMaira, 500);
      })();
    </script>
  </body>
